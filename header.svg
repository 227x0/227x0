<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Vladyslav Simonov — Cybersecurity">
  <defs>
    <!-- Background gradients -->
    <radialGradient id="bgRad" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="60%" stop-color="#05080f"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>
    <linearGradient id="streak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2ff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#00f2ff" stop-opacity="0.08"/>
      <stop offset="55%" stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2ff"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>

    <!-- Glows -->
    <filter id="glowCyan" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#00f2ff" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowPurple" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#7c3aed" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Hex grid pattern -->
    <pattern id="hexGrid" width="60" height="104" patternUnits="userSpaceOnUse" patternTransform="scale(0.6)">
      <path d="M30 0 L60 17.3 L60 51.9 L30 69.2 L0 51.9 L0 17.3 Z" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="360" fill="url(#bgRad)"/>
  <rect width="1200" height="360" fill="url(#hexGrid)" opacity="0.25"/>

  <!-- Stars / particles -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="120" cy="60" r="1.2"/>
    <circle cx="250" cy="90" r="0.8"/>
    <circle cx="980" cy="70" r="1"/>
    <circle cx="1080" cy="140" r="1.3"/>
    <circle cx="90" cy="280" r="0.9"/>
    <circle cx="320" cy="300" r="1.1"/>
    <circle cx="890" cy="290" r="0.8"/>
    <circle cx="1120" cy="260" r="1"/>
    <circle cx="180" cy="180" r="0.7"/>
    <circle cx="1020" cy="190" r="0.7"/>
    <circle cx="600" cy="40" r="1.2"/>
    <circle cx="430" cy="320" r="0.9"/>
    <circle cx="760" cy="330" r="0.9"/>
  </g>

  <!-- Diagonal light streaks -->
  <g opacity="0.6">
    <rect x="-100" y="0" width="400" height="360" fill="url(#streak)" transform="rotate(-35 600 180)"/>
    <rect x="900" y="0" width="400" height="360" fill="url(#streak)" transform="rotate(35 600 180)"/>
  </g>

  <!-- Top neon bar -->
  <rect width="1200" height="4" fill="url(#accentBar)"/>
  <rect x="0" y="4" width="1200" height="1" fill="#00f2ff" opacity="0.25"/>

  <!-- Bottom neon bar -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#accentBar)"/>

  <!-- Corner brackets -->
  <g stroke="url(#accentBar)" stroke-width="2.5" fill="none" opacity="0.8" filter="url(#softGlow)">
    <path d="M45 45 L45 85 L85 85"/>
    <path d="M1155 45 L1155 85 L1115 85"/>
    <path d="M45 315 L45 275 L85 275"/>
    <path d="M1155 315 L1155 275 L1115 275"/>
  </g>

  <!-- Circuit lines left -->
  <g stroke="#00f2ff" stroke-width="1.5" fill="none" opacity="0.25" filter="url(#softGlow)">
    <path d="M200 80 L160 80 L160 160 L130 160"/>
    <path d="M200 120 L180 120 L180 200 L150 200"/>
    <circle cx="130" cy="160" r="3" fill="#00f2ff" stroke="none"/>
    <circle cx="150" cy="200" r="3" fill="#00f2ff" stroke="none"/>
  </g>

  <!-- Circuit lines right -->
  <g stroke="#ff0055" stroke-width="1.5" fill="none" opacity="0.25" filter="url(#softGlow)">
    <path d="M1000 80 L1040 80 L1040 160 L1070 160"/>
    <path d="M1000 120 L1020 120 L1020 200 L1050 200"/>
    <circle cx="1070" cy="160" r="3" fill="#ff0055" stroke="none"/>
    <circle cx="1050" cy="200" r="3" fill="#ff0055" stroke="none"/>
  </g>

  <!-- Central shield / lock icon -->
  <g transform="translate(540, 75)" filter="url(#glowPurple)">
    <!-- Outer shield -->
    <path d="M60 5 C60 5 110 22 110 65 C110 115 60 150 60 150 C60 150 10 115 10 65 C10 22 60 5 60 5 Z" fill="none" stroke="url(#accentBar)" stroke-width="4"/>
    <!-- Inner lock body -->
    <rect x="42" y="70" width="36" height="42" rx="5" fill="none" stroke="#00f2ff" stroke-width="3" filter="url(#glowCyan)"/>
    <!-- Lock shackle -->
    <path d="M48 70 L48 55 C48 43 72 43 72 55 L72 70" fill="none" stroke="#00f2ff" stroke-width="3" filter="url(#glowCyan)"/>
    <!-- Keyhole -->
    <circle cx="60" cy="86" r="5" fill="#ff0055" filter="url(#glowCyan)"/>
    <path d="M60 91 L56 105 L64 105 Z" fill="#ff0055" filter="url(#glowCyan)"/>
  </g>

  <!-- Main name -->
  <text x="600" y="255" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="900" fill="url(#textGrad)" letter-spacing="2">Vladyslav Simonov</text>

  <!-- Subtitle with neon gradient -->
  <text x="600" y="290" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="url(#neonText)" letter-spacing="1">CYBERSECURITY · SOC L1/L2 · HOME LAB</text>

  <!-- Tagline -->
  <text x="600" y="325" text-anchor="middle" font-family="'Fira Code', 'JetBrains Mono', 'Consolas', monospace" font-size="15" fill="#64748b" letter-spacing="3">DETECT EARLY  ·  RESPOND FAST  ·  LEARN CONTINUOUSLY</text>
</svg>
